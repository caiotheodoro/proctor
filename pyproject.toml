[project]
name = "proctor"
version = "0.0.0"
description = "Prices whether an agent tool call was the right one, against a deterministic oracle and a flag-everything floor."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["pydantic>=2.7"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs/private"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "schema",
    "forge",
    "oracle",
    "eval",
    "baselines/schema_check",
    "baselines/judge",
    "model",
]
